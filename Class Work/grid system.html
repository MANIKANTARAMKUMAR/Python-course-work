<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid system</title>
    <style>
        .grid{
            background-color: blue;
            height:500px;
            width:50%;
            display:grid;
            grid-template-columns: repeat(5,1fr);
            grid-template-rows:repeat(4,1fr);
        }
        .box{
            border:1px dotted ;
            display:flex;
            justify-content:center;
            align-items:center;
            color:aliceblue;
        }
        .box2{
            grid-column: 1/2;
            background-color: chartreuse;
        }
        .box6{
            grid-column:2/-1;
            background-color: black;
        }
    </style>
</head>
<body>
    <div class="grid">
        <div class="box"></div>
        <div class="box2">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box6">3</div>
        <div class="box">4</div>
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
</body>
</html>
