<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex box</title>
    <style>
        body{
            height :100vh;
        }
        .container{
            background-color:blueviolet;
            height:90vh;
            margin:5px;
            padding:5px;
            border:1px solid white;
            text-align: center;
            display:flex;
            flex-wrap: wrap;
            flex-direction: row;
            gap:10px;
            justify-content:center;
            align-items:center;
            /*align-content:flex-end;*/

        }
        .box{
            height:50px;
            width:80px;
            background-color: rgb(255, 0, 0);
            margin :10px;
        }
        .box1{
            align-self: flex-start;
        }
        .box4{
            align-self: flex-end;
        }
        .box8{
            align-self:flex-start;
        }
    </style>
</head>
<body>
    <div class = "container">
        <div class="box box1">1</div>
        <div class="box box 2">2</div>
        <div class ="box box4">3</div>
        <div class ="box">100</div>
        <div class ="box box8">hi</div>
        

    </div>
    
</body>
</html>
